name: Generate Design Tokens

on:
  pull_request:
    paths:
      - "lib/tokens/*.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tokens:
    # Only run on PRs created by ZeroHeight
    if: github.event.pull_request.user.login == 'zeroheight[bot]' || github.event.pull_request.user.login == 'zeroheight-bot' || contains(github.event.pull_request.title, 'zeroheight') || contains(github.event.pull_request.head.ref, 'zeroheight')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart tokens from JSON
        run: dart run tool/generate_tokens.dart

      - name: Format generated files
        run: dart format lib/tokens/

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet lib/tokens/*.dart || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add lib/tokens/*.dart
          git commit -m "chore: auto-generate Dart tokens from ZeroHeight JSON"
          git push
